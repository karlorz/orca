name: Fork Mobile Voice Release

on:
  push:
    tags:
      - 'fork-voice-v*'

permissions:
  contents: read

concurrency:
  group: fork-mobile-voice-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'karlorz/orca'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify reachability from fork-main
        env:
          TARGET_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [[ ! "$REF_NAME" =~ ^refs/tags/fork-voice-v.+$ ]]; then
            echo "Only non-empty tag refs matching refs/tags/fork-voice-v<suffix> are allowed: $REF_NAME" >&2
            exit 1
          fi
          git fetch "${SERVER_URL}/karlorz/orca.git" fork-main:refs/remotes/fork/fork-main
          if ! git merge-base --is-ancestor "$TARGET_SHA" refs/remotes/fork/fork-main; then
            echo "Commit $TARGET_SHA is not reachable from fork-main branch in karlorz/orca" >&2
            exit 1
          fi
          echo "Commit $TARGET_SHA is verified reachable from fork-main."

      - uses: ./.github/actions/install-node-dependencies

      - name: Setup mobile pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Run desktop pet voice relay and mobile allowlist tests
        run: |
          pnpm exec vitest run src/main/runtime/pet-voice-relay.test.ts \
            src/main/runtime/pet-voice-relay-p2.test.ts \
            src/main/runtime/pet-voice-subscription-presence.test.ts \
            src/main/runtime/runtime-rpc-mobile-method-allowlist.test.ts \
            src/main/runtime/mobile-rpc-allowlist.test.ts

      - name: Run root code quality and reliability gates
        run: |
          pnpm run audit:code-quality:native
          pnpm run audit:code-quality:type-aware
          pnpm run check:reliability-gates
          pnpm run check:max-lines-ratchet
          pnpm run check:runtime-electron-ratchet

      - name: Run root typecheck
        run: pnpm typecheck

      - name: Run focused workflow, config, and APK inspection tests
        run: |
          pnpm exec vitest run config/scripts/fork-mobile-voice-release.test.mjs \
            config/scripts/inspect-android-apk.test.mjs \
            config/scripts/electron-builder-mac-channel-config.test.mjs

      - name: Mobile typecheck
        working-directory: mobile
        run: pnpm typecheck

      - name: Mobile test
        working-directory: mobile
        run: pnpm test

      - name: Mobile lint
        working-directory: mobile
        run: pnpm lint

      - name: Mobile format check
        working-directory: mobile
        run: pnpm format:check

  build-mac-arm64:
    needs: [verify]
    if: github.repository == 'karlorz/orca'
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure native runtime ready
        run: node config/scripts/ensure-native-runtime.mjs --runtime=node

      - name: Compute fork voice build version
        id: version
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: node config/scripts/fork-voice-build-version.mjs

      - name: Build release bundles
        env:
          ORCA_SKIP_DEV_CLI_INSTALL: '1'
        run: pnpm build:release

      - name: Package macOS arm64 artifacts
        env:
          ORCA_FORK_VOICE_BUILD: '1'
          ORCA_FORK_VOICE_BUILD_VERSION: ${{ steps.version.outputs.version }}
          ORCA_BUILD_COMMIT: ${{ github.sha }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --mac --arm64 --config config/electron-builder.config.cjs

      - name: Inspect packaged ZIP in runner temp
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          INSPECT_DIR="$(mktemp -d)"
          ZIP_PATH="dist/orca-macos-arm64.zip"
          echo "Extracting ZIP $ZIP_PATH for inspection into $INSPECT_DIR..."
          unzip -q "$ZIP_PATH" -d "$INSPECT_DIR"
          APP_PATH="$INSPECT_DIR/Orca.app"

          # 1. Mach-O arm64 main executable
          EXEC_FILE="$APP_PATH/Contents/MacOS/Orca"
          FILE_INFO="$(file "$EXEC_FILE")"
          echo "Main executable file info: $FILE_INFO"
          if [[ "$FILE_INFO" != *"arm64"* ]]; then
            echo "Expected arm64 binary in Orca executable, got $FILE_INFO" >&2
            exit 1
          fi

          # 2. Info.plist bundle version
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")"
          echo "Bundle version: $PLIST_VERSION"
          if [[ "$PLIST_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Expected bundle version $EXPECTED_VERSION, got $PLIST_VERSION" >&2
            exit 1
          fi

          # 3. Ad-hoc code signature and no notarization claim
          echo "Verifying strict ad-hoc code signature..."
          codesign --verify --deep --strict "$APP_PATH"
          CODESIGN_INFO="$(codesign -dvvv "$APP_PATH" 2>&1)"
          echo "Codesign info:"
          echo "$CODESIGN_INFO"
          if [[ "$CODESIGN_INFO" == *"TeamIdentifier="* && "$CODESIGN_INFO" != *"TeamIdentifier=not set"* ]]; then
            echo "Unexpected TeamIdentifier found in development build: $CODESIGN_INFO" >&2
            exit 1
          fi
          if [[ "$CODESIGN_INFO" != *"Signature=adhoc"* && "$CODESIGN_INFO" != *"flags=0x2(adhoc)"* ]]; then
            echo "Missing positive ad-hoc signature marker in codesign info: $CODESIGN_INFO" >&2
            exit 1
          fi
          if spctl -a -vv "$APP_PATH" 2>&1 | grep -i "notarized"; then
            echo "Unexpected notarization acceptance on ad-hoc build" >&2
            exit 1
          fi

          # 4. Updater metadata points to karlorz/orca
          UPDATE_YML="$APP_PATH/Contents/Resources/app-update.yml"
          if [[ ! -f "$UPDATE_YML" ]]; then
            echo "Missing required app-update.yml in packaged app" >&2
            exit 1
          fi
          echo "app-update.yml contents:"
          cat "$UPDATE_YML"
          if ! grep -q "owner: karlorz" "$UPDATE_YML" || ! grep -q "repo: orca" "$UPDATE_YML"; then
            echo "app-update.yml missing karlorz/orca target" >&2
            exit 1
          fi

          # 5. Packaged app.asar robust listing & extraction check
          ASAR_PATH="$APP_PATH/Contents/Resources/app.asar"
          ASAR_EXTRACT_DIR="$(mktemp -d)"
          pnpm exec asar extract "$ASAR_PATH" "$ASAR_EXTRACT_DIR"
          if ! grep -r -q "pet.speak.subscribe" "$ASAR_EXTRACT_DIR"; then
            echo "pet.speak.subscribe missing from packaged app.asar" >&2
            exit 1
          fi
          if ! grep -r -q "pet.speak.complete" "$ASAR_EXTRACT_DIR"; then
            echo "pet.speak.complete missing from packaged app.asar" >&2
            exit 1
          fi
          echo "All macOS artifact inspections passed."

      - name: Collect macOS metadata fragment
        id: mac_meta
        run: |
          set -euo pipefail
          mkdir -p mac-artifacts
          cp dist/orca-macos-arm64.dmg mac-artifacts/orca-macos-arm64.dmg
          cp dist/orca-macos-arm64.zip mac-artifacts/orca-macos-arm64.zip
          cat <<EOF > mac-artifacts/mac-metadata.json
          {
            "nodeVersion": "$(node -v)",
            "electronBuilderVersion": "$(pnpm exec electron-builder --version)",
            "arch": "arm64",
            "runner": "macos-15"
          }
          EOF

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac-artifacts
          path: mac-artifacts/*
          if-no-files-found: error

  build-android:
    needs: [verify]
    if: github.repository == 'karlorz/orca'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Verify generated Android manifest
        working-directory: mobile
        run: |
          set -euo pipefail
          cd android && ./gradlew :app:processDebugManifest
          cd ..
          pnpm verify:pet-speech-manifest -- android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml

      - name: Prove debug keystore release signing in generated build.gradle
        working-directory: mobile
        run: |
          set -euo pipefail
          if ! grep -q "signingConfig signingConfigs.debug" android/app/build.gradle; then
            echo "Release build in build.gradle does not use debug signingConfig" >&2
            exit 1
          fi

      - name: Build Android release APK
        working-directory: mobile
        run: cd android && ./gradlew assembleRelease

      - name: Inspect packaged APK with strict Android SDK inspector
        run: |
          set -euo pipefail
          APK_COUNT="$(find mobile/android/app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | wc -l | tr -d ' ')"
          if [[ "$APK_COUNT" -ne 1 ]]; then
            echo "Expected exactly one APK, found $APK_COUNT" >&2
            exit 1
          fi
          APK_PATH="$(find mobile/android/app/build/outputs/apk/release -maxdepth 1 -name "*.apk")"
          echo "Found APK: $APK_PATH"

          mkdir -p android-artifacts
          cp "$APK_PATH" android-artifacts/orca-mobile.apk

          node config/scripts/inspect-android-apk.mjs \
            android-artifacts/orca-mobile.apk \
            "" \
            "" \
            "" \
            mobile/android/app/debug.keystore \
            android-artifacts/android-metadata.json

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-artifacts
          path: android-artifacts/*
          if-no-files-found: error

  publish-release:
    needs: [verify, build-mac-arm64, build-android]
    if: github.repository == 'karlorz/orca'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies

      - name: Download all job artifacts
        uses: actions/download-artifact@v6
        with:
          path: staged-artifacts

      - name: Prepare release package, checksums, and metadata
        id: pkg
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p raw-artifacts
          cp staged-artifacts/mac-artifacts/* raw-artifacts/
          cp staged-artifacts/android-artifacts/* raw-artifacts/

          node -e '
            import("./config/scripts/fork-voice-package-release.mjs").then(async ({ packageDraftRelease }) => {
              await packageDraftRelease({
                artifactsDir: "raw-artifacts",
                outputDir: "final-release-assets",
                sourceSha: process.env.SOURCE_SHA,
                tag: process.env.TAG_NAME,
                runId: process.env.RUN_ID,
                runNumber: process.env.RUN_NUMBER,
                runAttempt: process.env.RUN_ATTEMPT,
                repository: process.env.REPOSITORY,
                verificationCommands: [
                  "pnpm vitest run src/main/runtime/pet-voice-relay.test.ts",
                  "pnpm run audit:code-quality:native",
                  "pnpm run audit:code-quality:type-aware",
                  "pnpm run check:reliability-gates",
                  "pnpm run check:max-lines-ratchet",
                  "pnpm run check:runtime-electron-ratchet",
                  "pnpm typecheck",
                  "cd mobile && pnpm typecheck",
                  "cd mobile && pnpm test",
                  "cd mobile && pnpm lint",
                  "cd mobile && pnpm format:check"
                ]
              })
            })
          '

      - name: Refuse existing release and create draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Refuse if non-draft release already exists for this tag
          if gh release view "$TAG_NAME" --repo karlorz/orca >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists in karlorz/orca. Refusing overwrite." >&2
            exit 1
          fi

          echo "Creating draft release for tag $TAG_NAME..."
          cat << 'EOF' > release-notes.md
          ### Orca Mobile Voice Development Release

          - Fork development build
          - macOS arm64
          - Android development-signed APK
          - Signing: ad-hoc/development; not notarized
          - Not Apple-notarized
          - Not auto-installed and no installation was performed
          EOF

          gh release create "$TAG_NAME" \
            --repo karlorz/orca \
            --target "$TARGET_SHA" \
            --draft \
            --prerelease \
            --title "$TAG_NAME" \
            --notes-file release-notes.md \
            final-release-assets/*

      - name: Verify uploaded release assets and publish prerelease
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d)"
          echo "Downloading draft assets into fresh temp dir $VERIFY_DIR..."
          gh release download "$TAG_NAME" --repo karlorz/orca --dir "$VERIFY_DIR"

          echo "Verifying exact asset set in downloaded draft..."
          EXPECTED_ASSETS="BUILD-METADATA.json
          SHA256SUMS.txt
          TEST-SUMMARY.md
          orca-macos-arm64.dmg
          orca-macos-arm64.zip
          orca-mobile.apk"

          ACTUAL_ASSETS="$(cd "$VERIFY_DIR" && find . -maxdepth 1 -type f -exec basename {} \; | sort)"
          CLEAN_EXPECTED="$(echo "$EXPECTED_ASSETS" | awk '{$1=$1};1' | sort)"

          if [[ "$ACTUAL_ASSETS" != "$CLEAN_EXPECTED" ]]; then
            echo "Asset set mismatch. Expected:"
            echo "$CLEAN_EXPECTED"
            echo "Got:"
            echo "$ACTUAL_ASSETS"
            exit 1
          fi

          echo "Verifying checksums of downloaded assets..."
          cd "$VERIFY_DIR"
          sha256sum -c SHA256SUMS.txt

          echo "Publishing prerelease..."
          gh release edit "$TAG_NAME" --repo karlorz/orca --draft=false --latest=false

      - name: Clean up incomplete draft on failure or cancellation
        if: (failure() || cancelled()) && steps.draft.outcome == 'success' && steps.publish.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "Job failed/cancelled after creating draft release. Deleting draft release without removing git tag..."
          gh release delete "$TAG_NAME" --repo karlorz/orca --yes || true
