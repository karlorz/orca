name: Fork own-mobile-relay image

on:
  workflow_dispatch:
  push:
    branches: [fork-main]
    paths:
      - config/docker/own-mobile-relay/**
      - scripts/build-own-mobile-relay.mjs
      - src/main/runtime/relay/own-mobile-relay-*.ts
      - .github/workflows/fork-own-mobile-relay-image.yml
  pull_request:
    branches: [fork-main]
    paths:
      - config/docker/own-mobile-relay/**
      - scripts/build-own-mobile-relay.mjs
      - src/main/runtime/relay/own-mobile-relay-*.ts
      - .github/workflows/fork-own-mobile-relay-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-own-mobile-relay-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'karlorz/orca'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Stage dockerignore for the repository-root build context
        run: cp config/docker/own-mobile-relay/.dockerignore .dockerignore

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names
        id: images
        env:
          EVENT_NAME: ${{ github.event_name }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          {
            echo 'list<<EOF'
            echo 'ghcr.io/karlorz/own-mobile-relay'
            if [ "$EVENT_NAME" != pull_request ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              echo 'docker.io/karlorz/own-mobile-relay'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/fork-main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: config/docker/own-mobile-relay/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
