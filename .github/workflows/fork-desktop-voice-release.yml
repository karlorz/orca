name: Fork Desktop Release

# Fork desktop tags are v<base>-<N> (e.g. v1.4.190-0, v1.4.190-1).
# Base is the newest upstream desktop tag (rc counts, -rc.N dropped).
# Tags are pushed by config/scripts/fork-next-desktop-tag.mjs --write (attended or fork-sync auto-cut).
# Tag-triggered only, no schedule.

on:
  push:
    tags:
      - 'v*.*.*-[0-9]*'

permissions:
  contents: read

concurrency:
  group: fork-desktop-voice-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'karlorz/orca'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify desktop tag and fork-main ancestry
        env:
          TARGET_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [[ ! "$REF_NAME" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "Only tags matching v<x.y.z>-<N> are allowed: $REF_NAME" >&2
            exit 1
          fi
          git fetch "${SERVER_URL}/karlorz/orca.git" fork-main:refs/remotes/fork/fork-main
          if ! git merge-base --is-ancestor "$TARGET_SHA" refs/remotes/fork/fork-main; then
            echo "Commit $TARGET_SHA is not reachable from fork-main" >&2
            exit 1
          fi

  build-mac:
    needs: [verify]
    if: github.repository == 'karlorz/orca'
    # macos-15: computer-use-macos needs Swift tools 6.0 (macos-14 ships 5.10).
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies

      - name: Resolve fork build version
        id: version
        env:
          FORK_DESKTOP_TAG: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node config/scripts/fork-desktop-build-version.mjs

      - name: Require fork self-signed identity
        env:
          CSC_LINK: ${{ secrets.ORCA_FORK_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.ORCA_FORK_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CSC_LINK:-}" || -z "${CSC_KEY_PASSWORD:-}" ]]; then
            echo "Missing GitHub secrets ORCA_FORK_CSC_LINK and/or ORCA_FORK_CSC_KEY_PASSWORD" >&2
            exit 1
          fi

      - name: Trust fork self-signed identity
        timeout-minutes: 2
        env:
          CSC_LINK: ${{ secrets.ORCA_FORK_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.ORCA_FORK_CSC_KEY_PASSWORD }}
          CSC_NAME: Orca Fork (karlorz)
        run: bash config/scripts/fork-macos-trust-self-signed-identity.sh

      - name: Build self-signed macOS
        env:
          ORCA_FORK_VOICE_BUILD: '1'
          ORCA_FORK_VOICE_BUILD_VERSION: ${{ steps.version.outputs.version }}
          ORCA_BUILD_COMMIT: ${{ github.sha }}
          CSC_LINK: ${{ secrets.ORCA_FORK_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.ORCA_FORK_CSC_KEY_PASSWORD }}
          CSC_NAME: Orca Fork (karlorz)
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
        run: |
          set -euo pipefail
          pnpm run build:desktop
          pnpm run build:computer-macos
          pnpm run build:keyboard-layout-macos
          pnpm run build:notification-status-macos
          pnpm run build:speech-macos
          pnpm run ensure:electron-runtime
          # --publish never: tag pushes default to onTagOrDraft and demand GH_TOKEN;
          # our publish-release job owns release creation.
          pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --publish never
          app="$(find dist -name 'Orca.app' -type d | head -n 1)"
          if [[ -z "$app" ]]; then
            echo "Packed Orca.app not found under dist/" >&2
            ls -la dist || true
            exit 1
          fi
          if [[ ! -x "$app/Contents/MacOS/orca-speech" ]]; then
            echo "Packed app missing executable $app/Contents/MacOS/orca-speech" >&2
            ls -la "$app/Contents/MacOS" || true
            exit 1
          fi
          dump="$(codesign -dv --verbose=2 "$app" 2>&1)"
          echo "$dump"
          if echo "$dump" | grep -q 'flags=0x2(adhoc)'; then
            echo "Packed app is still ad-hoc" >&2
            exit 1
          fi
          if ! echo "$dump" | grep -q 'Authority=Orca Fork (karlorz)'; then
            echo "Packed app is not signed by Orca Fork (karlorz)" >&2
            exit 1
          fi

      - name: Stage mac artifacts
        run: |
          set -euo pipefail
          mkdir -p desktop-artifacts-mac
          shopt -s nullglob
          for archive in orca-macos-x64.dmg orca-macos-arm64.dmg orca-macos-x64.zip orca-macos-arm64.zip latest-mac.yml; do
            if [[ ! -f "dist/$archive" ]]; then
              echo "Expected dist/$archive" >&2
              ls -la dist || true
              exit 1
            fi
            cp "dist/$archive" desktop-artifacts-mac/
          done
          for blockmap in dist/*.blockmap; do
            cp "$blockmap" desktop-artifacts-mac/
          done
          node config/scripts/verify-fork-desktop-release-artifacts.mjs desktop-artifacts-mac --platform=mac

      - name: Upload mac artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-artifacts-mac
          path: desktop-artifacts-mac/*
          if-no-files-found: error

  build-linux:
    needs: [verify]
    if: github.repository == 'karlorz/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-linux-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-linux-

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron

      - name: Resolve fork build version
        id: version
        env:
          FORK_DESKTOP_TAG: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node config/scripts/fork-desktop-build-version.mjs

      - name: Build package inputs
        run: |
          status=0
          pnpm run build:cli || status=1

          scripts=(build:relay build:electron-vite:parallel)
          pids=()
          for script in "${scripts[@]}"; do
            pnpm run "$script" &
            pids+=("$!")
          done

          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

      - name: Project web client from renderer build
        run: pnpm run build:web-from-renderer

      - name: Build native components
        run: pnpm run build:native

      - name: Install Linux package tooling
        run: sudo apt-get update && sudo apt-get install -y cpio rpm

      - name: Build Linux packages
        env:
          ORCA_FORK_VOICE_BUILD: '1'
          ORCA_FORK_VOICE_BUILD_VERSION: ${{ steps.version.outputs.version }}
          ORCA_BUILD_COMMIT: ${{ github.sha }}
          ORCA_REUSE_PREPARED_NATIVE_RUNTIME: '1'
        run: |
          set -euo pipefail
          pnpm exec electron-builder --config config/electron-builder.config.cjs --linux AppImage deb rpm --x64 --publish never

      - name: Stage linux artifacts
        env:
          FORK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p desktop-artifacts-linux
          shopt -s nullglob
          for pattern in orca-linux.AppImage "orca-ide_${FORK_VERSION}_amd64.deb" "orca-ide-${FORK_VERSION}.x86_64.rpm" latest-linux.yml; do
            matched=(dist/$pattern)
            if [[ ${#matched[@]} -eq 0 || ! -f "${matched[0]}" ]]; then
              echo "Expected dist/$pattern" >&2
              ls -la dist || true
              exit 1
            fi
            cp dist/$pattern desktop-artifacts-linux/
          done
          for blockmap in dist/*.blockmap; do
            cp "$blockmap" desktop-artifacts-linux/
          done
          node config/scripts/verify-fork-desktop-release-artifacts.mjs desktop-artifacts-linux --platform=linux

      - name: Upload linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-artifacts-linux
          path: desktop-artifacts-linux/*
          if-no-files-found: error

  build-windows:
    needs: [verify]
    if: github.repository == 'karlorz/orca'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-windows-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-windows-

      - uses: ./.github/actions/install-node-dependencies
        id: deps
        with:
          native-runtime: node
          persist-native-cache: 'false'

      - name: Resolve fork build version
        id: version
        shell: bash
        env:
          FORK_DESKTOP_TAG: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node config/scripts/fork-desktop-build-version.mjs

      - name: Cache Windows CLI launcher
        uses: actions/cache@v5
        with:
          path: native/windows-cli-launcher/.build
          key: windows-cli-launcher-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/windows-cli-launcher/**', 'config/scripts/build-windows-cli-launcher.mjs') }}

      - name: Build Windows native helpers
        shell: pwsh
        run: |
          node config/scripts/build-windows-cli-launcher.mjs
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=x64

      - name: Build package inputs
        shell: bash
        env:
          ORCA_REUSE_WINDOWS_CLI_LAUNCHER: '1'
        run: pnpm run build:release:parallel

      - name: Prepare Electron native runtime
        shell: bash
        run: node config/scripts/ensure-native-runtime.mjs --runtime=electron

      - name: Build unsigned Windows NSIS installer
        shell: pwsh
        env:
          ORCA_FORK_VOICE_BUILD: '1'
          ORCA_FORK_VOICE_BUILD_VERSION: ${{ steps.version.outputs.version }}
          ORCA_BUILD_COMMIT: ${{ github.sha }}
          ORCA_REUSE_PREPARED_NATIVE_RUNTIME: '1'
        run: |
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never
          node config/scripts/generate-windows-blockmap.mjs 'dist/orca-windows-setup.exe' 'dist/orca-windows-setup.exe.blockmap'

      - name: Stage windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path desktop-artifacts-windows -Force
          foreach ($file in @('orca-windows-setup.exe', 'orca-windows-setup.exe.blockmap', 'latest.yml')) {
            $src = Join-Path 'dist' $file
            if (-not (Test-Path $src)) {
              throw "Expected $src"
            }
            Copy-Item -Path $src -Destination desktop-artifacts-windows/ -Force
          }
          node config/scripts/verify-fork-desktop-release-artifacts.mjs desktop-artifacts-windows --platform=windows

      - name: Upload windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-artifacts-windows
          path: desktop-artifacts-windows/*
          if-no-files-found: error

  publish-release:
    needs: [verify, build-mac, build-linux, build-windows]
    if: github.repository == 'karlorz/orca'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies

      - name: Download mac artifacts
        uses: actions/download-artifact@v6
        with:
          name: desktop-artifacts-mac
          path: all-desktop-artifacts

      - name: Download linux artifacts
        uses: actions/download-artifact@v6
        with:
          name: desktop-artifacts-linux
          path: all-desktop-artifacts

      - name: Download windows artifacts
        uses: actions/download-artifact@v6
        with:
          name: desktop-artifacts-windows
          path: all-desktop-artifacts

      - name: Combine checksums and verify all release artifacts
        run: |
          set -euo pipefail
          rm -f all-desktop-artifacts/SHA256SUMS.txt
          (cd all-desktop-artifacts && shasum -a 256 * > SHA256SUMS.txt)
          node config/scripts/verify-fork-desktop-release-artifacts.mjs all-desktop-artifacts --platform=all

      - name: Create draft then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo karlorz/orca >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Refusing overwrite." >&2
            exit 1
          fi
          cat << 'EOF' > release-notes.md
          ### Orca Desktop Development Release

          - Fork desktop train (macOS self-signed; Linux AppImage/deb/rpm; Windows unsigned NSIS)
          - Tracks upstream desktop train tag matching the base version
          - Separate from upstream v1.4.x cuts and from mobile-android tags
          - Never attach these desktop files to a mobile-android tag
          EOF
          gh release create "$TAG_NAME" \
            --repo karlorz/orca \
            --target "$TARGET_SHA" \
            --draft \
            --prerelease \
            --title "$TAG_NAME" \
            --notes-file release-notes.md \
            all-desktop-artifacts/*
          gh release edit "$TAG_NAME" --repo karlorz/orca --draft=false --prerelease --latest=false
