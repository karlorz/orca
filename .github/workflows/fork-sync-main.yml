name: Sync fork main from upstream

# GitHub "Sync fork" follows the default branch and can re-mirror deleted
# branches — never use that button. This workflow:
#   1. Fast-forwards GitHub `main` from stablyai/orca via merge-upstream
#      (upstream has no fork-main, so merge-upstream cannot target it).
#   2. Merges stablyai/orca `main` into `fork-main` with git merge --no-ff.
#   3. Mirrors upstream `v*` tags into karlorz/orca without overwriting existing tags.
#   4. Auto-cuts next fork desktop tag (v<base>-0) if a new upstream desktop base appeared.
#   5. Auto-resolves mobile/app.json version conflicts (published train + max versionCode).
#   6. Auto-cuts mobile-android-v<train>-0 on a new published mobile train (app.json bump first).
# Other merge conflicts fail closed. Extra mobile -1/-2 stay attended.
# GitHub cron is UTC-only: 01:17 UTC = 09:17 HKT (UTC+8, no DST), timed after
# upstream's usual evening-UTC release window. workflow_dispatch = manual invoke.

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fork-sync-main
  cancel-in-progress: false

jobs:
  sync-main:
    if: github.repository == 'karlorz/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fast-forward main from stablyai/orca
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Missing repo secret FORK_SYNC_TOKEN (classic PAT: repo + workflow)." >&2
            echo "GITHUB_TOKEN cannot update workflow files on main." >&2
            exit 1
          fi
          MIRROR_BRANCH=main
          if [[ "$MIRROR_BRANCH" == "fork-main" ]]; then
            echo "Refusing to sync fork-main" >&2
            exit 1
          fi
          gh api --method POST "repos/${GH_REPO}/merge-upstream" -f branch="$MIRROR_BRANCH"

      - name: Checkout fork-main for train report
        uses: actions/checkout@v6
        with:
          ref: fork-main
          persist-credentials: false

      - name: Report latest upstream desktop and mobile trains
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: node config/scripts/fork-upstream-trains.mjs

  sync-fork-main:
    needs: sync-main
    if: github.repository == 'karlorz/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      before: ${{ steps.merge_fork_main.outputs.before }}
      after: ${{ steps.merge_fork_main.outputs.after }}
      pushed: ${{ steps.merge_fork_main.outputs.pushed }}
    steps:
      - name: Checkout fork-main
        uses: actions/checkout@v6
        with:
          ref: fork-main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Merge stablyai/orca main into fork-main
        id: merge_fork_main
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'fork-sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node config/scripts/fork-sync-fork-main.mjs --write

      - name: Mirror upstream v* tags
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: node config/scripts/fork-sync-upstream-tags.mjs --write

      - name: Auto-cut fork desktop tag for new upstream base
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        # --auto cuts v<base>-0 only when no fork tag covers that base yet;
        # otherwise it exits 0 with a skip line (daily no-op stays green).
        run: node config/scripts/fork-next-desktop-tag.mjs --auto

      - name: Auto-cut fork mobile tag for new published train
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        # --auto cuts mobile-android-v<train>-0 only when the published
        # upstream train base has no fork suffix yet. Bumps app.json first.
        # Daily no-op stays green. Extra -1/-2 remain attended --write.
        run: node config/scripts/fork-next-mobile-tag.mjs --auto

      - name: Report latest upstream desktop and mobile trains
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: node config/scripts/fork-upstream-trains.mjs

  own-relay-followup:
    needs: sync-fork-main
    if: "github.repository == 'karlorz/orca' && needs.sync-fork-main.outputs.pushed == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout merge SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync-fork-main.outputs.after }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect own-relay protocol hits
        id: detect
        run: |
          set -euo pipefail
          node config/scripts/fork-own-relay-followup.mjs \
            --before '${{ needs.sync-fork-main.outputs.before }}' \
            --after '${{ needs.sync-fork-main.outputs.after }}' | tee /tmp/own-relay-detect.txt
          if grep -Eq '^(noop|no-allowlist-hit)$' /tmp/own-relay-detect.txt; then
            echo 'matched=false' >> "$GITHUB_OUTPUT"
          else
            echo 'matched=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout wiki
        if: steps.detect.outputs.matched == 'true'
        uses: actions/checkout@v6
        with:
          repository: karlorz/wiki
          token: ${{ secrets.WIKI_FOLLOWUP_TOKEN }}
          path: wiki
          fetch-depth: 1

      - name: File wiki follow-up
        if: steps.detect.outputs.matched == 'true'
        env:
          WIKI_FOLLOWUP_TOKEN: ${{ secrets.WIKI_FOLLOWUP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${WIKI_FOLLOWUP_TOKEN}" ]]; then
            echo "Missing WIKI_FOLLOWUP_TOKEN (fine-grained PAT: karlorz/wiki Contents read/write)." >&2
            exit 1
          fi
          node config/scripts/fork-own-relay-followup.mjs \
            --before '${{ needs.sync-fork-main.outputs.before }}' \
            --after '${{ needs.sync-fork-main.outputs.after }}' \
            --wiki "$GITHUB_WORKSPACE/wiki" \
            --write
          cd "$GITHUB_WORKSPACE/wiki"
          git config user.name 'fork-sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add raw/transcripts projects/orca/work
          if git diff --cached --quiet; then
            echo 'wiki already had follow-up'
            exit 0
          fi
          git commit -m "chore(orca): own-relay follow-up ${{ needs.sync-fork-main.outputs.after }}"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo 'wiki push failed after retries' >&2
          exit 1
