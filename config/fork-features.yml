# Fork-only feature inventory for karlorz/orca.
# Working branch is fork-main. GitHub `main` is a disposable upstream mirror.
# Add a row when a feat lands on fork-main. Do not file upstream issues/PRs.
fork:
  workingBranch: fork-main
  mirrorBranch: main
  defaultBranch: fork-main
  upstream: stablyai/orca
  upstreamBranch: main
  syncWorkflow: .github/workflows/fork-sync-main.yml
features:
  - id: herdr-agent-picker
    title: Herdr as a hook-free selectable agent
    kind: product
    status: landed
    paths:
      - src/renderer
  - id: herdr-right-click-mouse
    title: Cross-platform right-click mouse ownership routing
    kind: product
    status: landed
    paths:
      - src
  - id: pet-voice-sink
    title: Pet Cantonese voice sink over mobile RPC
    kind: product
    status: landed
    paths:
      - mobile/src/pet-speak
      - mobile/packages/expo-pet-speech
      - src/main/runtime
  - id: pet-voice-rate
    title: Honor pet speech rate on Android TTS
    kind: product
    status: landed
    paths:
      - mobile/packages/expo-pet-speech
  - id: hermes-es2023-array
    title: Hermes-safe Array polyfills so fork APKs open on Android 11+
    kind: product
    status: landed
    paths:
      - mobile
  - id: fork-mobile-android-tags
    title: Mobile tags stay 0.0.46-N; APK-only fork workflow
    kind: release
    status: landed
    paths:
      - .github/workflows/fork-mobile-voice-release.yml
      - mobile/app.json
  - id: fork-desktop-voice-release
    title: Self-signed macOS desktop prereleases on v1.4.190-N tags
    kind: release
    status: landed
    paths:
      - .github/workflows/fork-desktop-voice-release.yml
      - config/electron-builder.config.cjs
      - config/scripts/fork-desktop-build-version.mjs
      - config/scripts/fork-next-desktop-tag.mjs
  - id: pet-voice-fgs-hysteresis
    title: Keep pet-voice FGS through 5-minute Tailscale reconnects
    kind: product
    status: landed
    paths:
      - mobile/src/pet-speak
      - mobile/packages/expo-pet-speech
    wiki: projects/grok-desktop-pet/work/2026-08-25-pet-voice-fgs-hysteresis
  - id: mobile-all-usage-providers
    title: Mobile Settings Account usage switches including opt-in Grok
    kind: product
    status: landed
    paths:
      - mobile/src/components
      - mobile/app/account-usage-settings.tsx
      - mobile/src/home/MobileHomeAccountUsageCards.tsx
    wiki: projects/orca/work/2026-08-26-orca-mobile-grok-account-usage
  - id: fork-sync-main-mirror
    title: Daily GitHub Action mirrors main, merges upstream main into fork-main, auto-resolves mobile/app.json, auto-cuts desktop and mobile -0 tags
    kind: ci
    status: landed
    paths:
      - .github/workflows/fork-sync-main.yml
      - config/scripts/fork-sync-fork-main.mjs
      - config/scripts/fork-sync-upstream-tags.mjs
      - config/scripts/fork-next-desktop-tag.mjs
      - config/scripts/fork-next-mobile-tag.mjs
      - config/scripts/fork-upstream-trains.mjs
      - config/fork-features.yml
  - id: own-mobile-relay-overlay
    title: Packaged Sign in for Relay can default to sg01 own-auth/director (disabled until TLS hostname)
    kind: product
    status: landed
    paths:
      - src/main/orca-profiles/fork-own-relay-defaults.ts
      - src/main/orca-profiles/profile-cloud-auth-config.ts
    wiki: projects/orca/work/2026-08-26-self-hosted-mobile-relay-sg01
  - id: own-mobile-relay-durable-security-state
    title: Durable SQLite account, session, grant, and device state for own Relay
    kind: product
    status: landed
    paths:
      - src/main/runtime/relay
      - scripts/build-own-mobile-relay.mjs
    wiki: projects/orca/work/2026-08-27-own-relay-durable-security-state

  - id: pet-voice-android-rate-step
    title: Android pet TTS plays one 語速 step faster than Mac
    kind: product
    status: landed
    paths:
      - mobile/packages/expo-pet-speech
    wiki: projects/grok-desktop-pet/work/2026-08-27-android-pet-tts-rate

  - id: fork-desktop-auto-update-feed
    title: Fork desktop apps auto-update from karlorz/orca releases
    kind: ci
    status: landed
    paths:
      - src/main/updater-prerelease-feed.ts
      - src/main/updater.ts
      - .github/workflows/fork-desktop-voice-release.yml
  - id: fork-desktop-self-signed-ci
    title: Stable self-signed macOS identity so Squirrel can apply fork updates
    kind: ci
    status: landed
    paths:
      - config/electron-builder.config.cjs
      - config/scripts/fork-macos-trust-self-signed-identity.sh
      - .github/workflows/fork-desktop-voice-release.yml
    wiki: projects/orca/work/2026-08-28-fork-desktop-self-signed-ci

  - id: pet-speech-test-voice-selection
    title: Truthful exact Android Test Voice application and readback validation
    kind: product
    status: landed
    paths:
      - mobile/src/pet-speak
      - mobile/app/pet-speech-settings.tsx
      - mobile/packages/expo-pet-speech
    wiki: projects/grok-desktop-pet/work/2026-08-29-mobile-owned-pet-speech-settings
